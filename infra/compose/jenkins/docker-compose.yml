services:
  jenkins:
    image: jenkins/jenkins:${JENKINS_IMAGE_TAG:?set JENKINS_IMAGE_TAG}
    restart: unless-stopped
    user: 1000:1000
    ports:
      - 127.0.0.1:8088:8080
      - 127.0.0.1:50000:50000
    volumes:
      - jenkins-home:/var/jenkins_home
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8080/login >/dev/null]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  jenkins-home:
