- name: Install Docker engine package
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Permit service user to run Docker
  ansible.builtin.user:
    name: "{{ service_user }}"
    groups: docker
    append: true
