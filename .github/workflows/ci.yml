name: Yocto CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build Sensornode Image
    runs-on: self-hosted
    timeout-minutes: 600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pre-Build Validation
        run: |
          echo "[*] Running fast-fail spec and YAML validation checks..."
          make docs-check yaml-check

      - name: Verify MinIO Cache Endpoint
        run: |
          echo "[*] Checking MinIO health..."
          curl -sSf http://127.0.0.1:9000/minio/health/live > /dev/null 2>&1 || \
          curl -sSf http://host.docker.internal:9000/minio/health/live > /dev/null 2>&1 || {
            echo "[!] MinIO is unreachable on localhost:9000 and host.docker.internal:9000."
            echo "[!] Builds will compile from scratch without streaming cache."
          }

      - name: Execute BitBake Build
        run: |
          ./scripts/build-image.sh

      - name: Configure MinIO Client (Write Authentication)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT || 'http://127.0.0.1:9000' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          echo "[*] Configuring MinIO client credentials..."
          ENDPOINT="${MINIO_ENDPOINT}"
          USER="${MINIO_ACCESS_KEY}"
          PASS="${MINIO_SECRET_KEY}"

          # Fallback to local .env file if GitHub Secrets are unpopulated
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            if [ -f "infra/compose/minio/.env" ]; then
              echo "[*] GitHub secrets not detected; loading from infra/compose/minio/.env"
              USER=$(grep -E '^MINIO_ROOT_USER=' infra/compose/minio/.env | cut -d'=' -f2- | tr -d '"\r')
              PASS=$(grep -E '^MINIO_ROOT_PASSWORD=' infra/compose/minio/.env | cut -d'=' -f2- | tr -d '"\r')
            fi
          fi

          if [ -n "$USER" ] && [ -n "$PASS" ]; then
            mc --no-color alias set tusker "${ENDPOINT}" "${USER}" "${PASS}"
          else
            echo "[!] Warning: No MinIO credentials found. Cache sync will fail."
          fi

      - name: Push Updated Cache to MinIO
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHE_WRITE_ALLOWED: "1"
        run: |
          echo "[*] Main branch build succeeded. Syncing cache to MinIO..."
          ./scripts/cache-sync.sh push

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensornode-build-outputs
          path: |
            artifacts/deploy/
            artifacts/release/
          if-no-files-found: warn

