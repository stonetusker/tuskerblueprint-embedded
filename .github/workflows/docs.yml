name: Documentation and Specification Validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: make docs-check yaml-check
