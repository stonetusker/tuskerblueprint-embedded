name: Pull Request Verification

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify Image
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify MinIO Availability
        run: |
          echo "[*] Checking MinIO streaming endpoint..."
          curl -sSf http://host.docker.internal:9000/minio/health/live > /dev/null || {
            echo "[!] MinIO endpoint not responding; BitBake will fall back to local/upstream."
          }

      - name: Execute BitBake Build
        run: |
          # Streams sstate and downloads anonymously via SSTATE_MIRRORS
          ./scripts/build-image.sh

      - name: Archive Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-artifacts
          path: |
            artifacts/deploy/
          retention-days: 5
          if-no-files-found: warn
