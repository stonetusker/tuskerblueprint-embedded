name: Nightly Build & Cache Refresh

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 AM UTC
  workflow_dispatch:

jobs:
  nightly-build:
    name: Nightly Image Build
    runs-on: self-hosted
    timeout-minutes: 600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean Working Build Directory
        run: |
          # Keep local cache/sstate, but ensure build/tmp is clean for regression tests
          rm -rf build/tmp

      - name: Run Full Build
        run: |
          ./scripts/build-image.sh

      - name: Update MinIO Distributed Cache
        env:
          CACHE_WRITE_ALLOWED: "1"
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT || 'http://127.0.0.1:9000' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          if [ -n "${MINIO_ACCESS_KEY:-}" ] && [ -n "${MINIO_SECRET_KEY:-}" ]; then
            mc --no-color alias set tusker "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
          fi
          ./scripts/cache-sync.sh push

      - name: Archive Nightly Deploy Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qemuarm64-${{ github.sha }}
          path: artifacts/deploy/
          retention-days: 7
