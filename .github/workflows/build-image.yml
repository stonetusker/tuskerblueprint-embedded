name: SensorNode Main Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yocto-main
  cancel-in-progress: false

env:
  KAS_FILE: kas/ci.yml
  IMAGE: sensornode-image-ci
  CACHE_DIR: /srv/yocto-cache
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build-test:
    runs-on: [self-hosted, linux, x64, yocto]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull shared cache
        env:
          MINIO_ALIAS: ${{ secrets.MINIO_ALIAS }}
          MINIO_DOWNLOADS_BUCKET: yocto-downloads
          MINIO_SSTATE_BUCKET: yocto-sstate
        run: CACHE_WRITE_ALLOWED=0 scripts/cache-sync.sh pull
      - name: Build image
        run: scripts/build-image.sh
      - name: QEMU runtime gate
        run: scripts/run-qemu-tests.sh
      - name: Push trusted cache
        if: success()
        env:
          MINIO_ALIAS: ${{ secrets.MINIO_ALIAS }}
          MINIO_DOWNLOADS_BUCKET: yocto-downloads
          MINIO_SSTATE_BUCKET: yocto-sstate
        run: CACHE_WRITE_ALLOWED=1 scripts/cache-sync.sh push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensornode-${{ github.sha }}
          path: artifacts/
          retention-days: 30
