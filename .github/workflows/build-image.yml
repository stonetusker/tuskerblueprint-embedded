name: Build Image Core

on:
  workflow_dispatch:
    inputs:
      push_cache:
        description: 'Upload generated cache to MinIO'
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      push_cache:
        required: false
        type: boolean
        default: false
    secrets:
      MINIO_ENDPOINT:
        required: false
      MINIO_ACCESS_KEY:
        required: false
      MINIO_SECRET_KEY:
        required: false

jobs:
  build:
    name: Yocto Build
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Build Image Script
        run: |
          ./scripts/build-image.sh

      - name: Sync Cache to MinIO
        if: ${{ inputs.push_cache == true }}
        env:
          CACHE_WRITE_ALLOWED: "1"
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT || 'http://127.0.0.1:9000' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          if [ -n "${MINIO_ACCESS_KEY:-}" ] && [ -n "${MINIO_SECRET_KEY:-}" ]; then
            mc --no-color alias set tusker "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
          fi
          ./scripts/cache-sync.sh push

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: artifacts/deploy/
          if-no-files-found: warn
