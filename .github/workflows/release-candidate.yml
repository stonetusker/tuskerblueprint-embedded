name: Release Candidate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0-rc1)'
        required: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Release Image
        run: |
          ./scripts/build-image.sh

      - name: Push Artifacts to MinIO Release Bucket
        env:
          RELEASE_TAG: ${{ github.ref_name || inputs.release_tag }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT || 'http://127.0.0.1:9000' }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          if [ -n "${MINIO_ACCESS_KEY:-}" ] && [ -n "${MINIO_SECRET_KEY:-}" ]; then
            mc --no-color alias set tusker "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
          fi

          echo "[*] Publishing release images and manifests to release-artifacts/${RELEASE_TAG}..."
          mc --no-color cp -r artifacts/deploy/ tusker/release-artifacts/${RELEASE_TAG}/
          
          if [ -d "artifacts/release" ]; then
            mc --no-color cp -r artifacts/release/ tusker/release-evidence/${RELEASE_TAG}/ || true
          fi

      - name: Sync New Sstate to Cache
        env:
          CACHE_WRITE_ALLOWED: "1"
        run: |
          ./scripts/cache-sync.sh push
