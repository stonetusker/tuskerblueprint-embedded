header:
  version: 14
  includes:
    - kas/base.yml
    - kas/mender.yml

target:
  - sensornode-image-ci

local_conf_header:
  ci: |
    BB_NUMBER_THREADS ?= "6"
    PARALLEL_MAKE ?= "-j 6"
    SENSORNODE_GIT_COMMIT = "${@d.getVar('GITHUB_SHA') or d.getVar('GIT_COMMIT') or 'unknown'}"
    SENSORNODE_BUILD_NUMBER = "${@d.getVar('GITHUB_RUN_NUMBER') or d.getVar('BUILD_NUMBER') or 'local'}"
    SENSORNODE_IMAGE_VERSION = "${@d.getVar('SENSORNODE_VERSION') or '0.3.0'}-${SENSORNODE_BUILD_NUMBER}-${SENSORNODE_GIT_COMMIT}"
    # testimage boots the bare ext4 rootfs without the Mender partition table,
    # so the boot and data mounts must not drop the CI image into emergency mode.
    MENDER_BOOT_PART_FSTAB_OPTS = "defaults,sync,nofail,x-systemd.device-timeout=10s"
    MENDER_DATA_PART_FSTAB_OPTS = "defaults,nofail,x-systemd.device-timeout=10s"
  hashserve: |
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    BB_HASHSERVE = ""
  testimage: |
    TEST_RUNQEMUPARAMS = "slirp"
    TEST_OVERALL_TIMEOUT = "600"

