header:
  version: 14

repos:
  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    commit: scarthgap
    layers:
      meta-mender-core:
      meta-mender-demo:
      meta-mender-qemu:

local_conf_header:
  mender: |
    INHERIT += "mender-full"
    INIT_MANAGER = "systemd"
    MENDER_ARTIFACT_NAME = "sensornode-0.3"
    RDEPENDS:packagegroup-core-boot:remove = "kernel-devicetree"
    MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "kernel-devicetree"
    PACKAGECONFIG:remove:pn-mender = "version-inventory-script"

